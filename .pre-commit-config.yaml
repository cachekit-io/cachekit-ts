# Pre-commit hooks for cachekit-ts
#
# Install (one time):   prek install --install-hooks
# Run on all files:     prek run --all-files
# Run on staged only:   prek run
# Update hook versions: prek autoupdate
#
# Uses prek (https://github.com/j178/prek), a Rust reimplementation of
# pre-commit that consumes this same .pre-commit-config.yaml format. Falling
# back to Python `pre-commit` works identically.

default_install_hook_types: [pre-commit, pre-push, commit-msg]
# Hooks with no `stages` run at commit and push, never on the commit message.
default_stages: [pre-commit, pre-push]

repos:
  # ─── TypeScript / JavaScript ─────────────────────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (auto-fix)
        entry: pnpm exec eslint --fix --max-warnings 0
        language: system
        files: ^packages/cachekit/src/.*\.(ts|tsx)$
        pass_filenames: true

      - id: prettier
        name: Prettier (auto-format)
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        files: \.(ts|tsx|js|mjs|cjs|json|md|yaml|yml)$
        exclude: |
          (?x)^(
            pnpm-lock\.yaml|
            packages/[^/]+/dist/.*|
            packages/cachekit-core-ts/index\.(js|d\.ts)|
            packages/cachekit/test/workers/fixtures/.*|
            \.release-please-manifest\.json
          )$
        pass_filenames: true

      - id: type-check
        name: TypeScript type-check (pre-push)
        entry: pnpm type-check
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
        stages: [pre-push]

  # ─── Rust (packages/cachekit-core-ts) ────────────────────────────────────
  - repo: local
    hooks:
      - id: cargo-fmt
        name: Cargo format
        entry: bash -c 'cd packages/cachekit-core-ts && cargo fmt --all -- --check'
        language: system
        files: ^packages/cachekit-core-ts/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: Cargo clippy
        entry: bash -c 'cd packages/cachekit-core-ts && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^packages/cachekit-core-ts/.*\.rs$
        pass_filenames: false

  # ─── GitHub Actions workflow linting ─────────────────────────────────────
  - repo: https://github.com/rhysd/actionlint
    rev: fd33e9f582a01a02885c93ae3775e1190cf63653 # v1.7.12 + fix for rhysd/actionlint#650; move to the next release tag  # pragma: allowlist secret
    hooks:
      - id: actionlint

  # ─── General file hygiene ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0  # pragma: allowlist secret
    hooks:
      - id: trailing-whitespace
        # markdown uses trailing whitespace for line breaks; the protocol
        # fixtures are sha256-pinned byte-for-byte against cachekit-io/protocol
        exclude: (\.md|^packages/cachekit/test/(protocol|workers)/fixtures/.*)$
      - id: end-of-file-fixer
        # never append a newline to a byte-pinned vendored fixture: the pin
        # would then be refreshed against our mutation, not upstream's bytes
        exclude: ^packages/cachekit/test/(protocol|workers)/fixtures/.*$
      - id: check-yaml
      - id: check-json
        exclude: ^(\.vscode/|(.*/)?tsconfig[^/]*\.json$) # tsconfig allows comments, at any depth
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict

  # ─── Secret scanning ─────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458 # v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            pnpm-lock\.yaml|
            packages/[^/]+/dist/.*|
            packages/cachekit-core-ts/index\.(js|d\.ts)|
            packages/cachekit/test/workers/fixtures/.*| # vendored protocol vectors: public hex ground truth, not secrets
            .*\.snap$
          )$

  # Keeps internal references (ticket ids, secret-store paths, internal hosts and process
  # names) out of user-facing docs and commit messages. The patterns are generic on purpose:
  # a list of specific internal names would itself disclose them.
  # Scope rule: https://docs.cachekit.io/contributing/#what-belongs-in-these-docs
  - repo: local
    hooks:
      - id: no-internal-references
        name: No internal references in docs
        language: pygrep
        entry: '\b(?i:LAB)-[0-9]+|op://|\.ts\.net|(?i:\bk3s[\s_-]+(?:cluster|node|host)s?\b)|dev\.cachekit\.io|\bStage [0-9]|\bAC-[0-9]|github\.com/cachekit(?![\w-])'
        files: ^((packages|crates)/[^/]+/)?README[^/]*$|^docs/
        types: [text]
        stages: [pre-commit]
      - id: no-internal-references-commit-msg
        name: No internal references in commit message
        # Same patterns. git hands this hook the raw message file: "# " comment lines, the diff
        # below the `git commit -v` scissors line, and its own merge and revert subjects, which
        # quote branch names and earlier subjects. Only the text the author wrote is checked.
        language: python
        entry: python -c
        args:
          - |
            import re, sys
            P = re.compile(r"\b(?i:LAB)-[0-9]+|op://|\.ts\.net|(?i:\bk3s[\s_-]+(?:cluster|node|host)s?\b)|dev\.cachekit\.io|\bStage [0-9]|\bAC-[0-9]|github\.com/cachekit(?![\w-])")
            KIND = r"(?:branch|branches|remote-tracking branch|remote-tracking branches|tag|tags|commit|commits)"
            GIT_SUBJECT = re.compile(rf"Merge {KIND} '[^']*'(?:(?:, |; | and ){KIND}? ?'[^']*')*(?: of \S+)?(?: into \S+)?|(?:Revert|Reapply) \".*\"")
            try:
                with open(sys.argv[1], encoding="utf-8", errors="replace") as f:
                    text = f.read()
            except OSError as e:
                sys.exit(f"{sys.argv[1]}: cannot read the commit message: {e}")
            text = text.split("# ------------------------ >8 ------------------------")[0]
            lines = [line for line in text.splitlines() if line.strip() and not re.match(r"#(?:[ \t]|$)", line)]
            if lines and GIT_SUBJECT.fullmatch(lines[0]):
                lines = lines[1:]
            bad = [line for line in lines if P.search(line)]
            for line in bad:
                print(f"{sys.argv[1]}: {line}")
            sys.exit(1 if bad else 0)
        stages: [commit-msg]
