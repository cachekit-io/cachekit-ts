name: Build Native

on:
  push:
    branches: [main]
    tags: ['cachekit-core-ts-v*']
  pull_request:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  RUSTUP_HOME: /tmp/rustup
  CARGO_HOME: /tmp/cargo

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: cachekit-lean
          - target: aarch64-unknown-linux-gnu
            os: cachekit-lean
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install dependencies
        run: pnpm install

      - name: Build native module
        working-directory: packages/cachekit-core-ts
        run: |
          pnpm build --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: bindings-${{ matrix.target }}
          path: packages/cachekit-core-ts/*.node
          if-no-files-found: error

  test:
    needs: build
    strategy:
      matrix:
        os: [cachekit-lean]
        node: [22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: packages/cachekit-core-ts

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Install dependencies
        run: pnpm install

      - name: Test native module
        working-directory: packages/cachekit-core-ts
        run: node -e "const m = require('.'); console.log('Version:', m.version())"

  publish:
    if: startsWith(github.ref, 'refs/tags/cachekit-core-ts-v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: packages/cachekit-core-ts/artifacts
          merge-multiple: true

      - name: Install dependencies
        run: pnpm install

      - name: Move artifacts to platform packages
        working-directory: packages/cachekit-core-ts
        run: npx napi artifacts --artifacts-dir artifacts

      - name: List platform packages
        working-directory: packages/cachekit-core-ts
        run: ls -la npm/*/

      - name: Publish platform packages
        working-directory: packages/cachekit-core-ts
        run: |
          find npm -mindepth 1 -maxdepth 1 -type d -exec npm publish {} --access public --provenance \;
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare main package
        working-directory: packages/cachekit-core-ts
        run: npx napi prepublish -t npm --skip-gh-release

      - name: Publish main package
        working-directory: packages/cachekit-core-ts
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
