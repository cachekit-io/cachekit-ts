name: Build Native

# This workflow BUILDS and TESTS only — it must not publish.
#
# @cachekit-io/cachekit-core-ts has never published from CI: 0.1.0 and 0.1.2
# were both manual (`cachekit-ray`, no provenance attestations), and the old
# tag-gated publish job here never ran once — GitHub App-created release tags
# don't trigger this workflow, and the repo has no NPM_TOKEN secret so it
# would have died ENEEDAUTH anyway (LAB-831, LAB-1390). It was deleted rather
# than migrated; do not re-add npm-token auth here.
#
# Until a working CI publish path exists (needs a release-please.yml job plus
# a package-level npm trusted publisher — tracked as LAB-1390's follow-up),
# publishing stays manual. Runbook facts the deleted job used to encode:
# push the cachekit-core-ts-v* tag by hand — that runs the full matrix here
# as pre-publish validation, and its bindings-* artifacts (expire ~90 days)
# are the only source of the darwin/windows .node binaries you cannot
# cross-build locally. napi-rs scaffolds npm/<platform>/package.json at the
# version present when `napi build` first ran and never bumps it, so run
# `npx napi version` before `npx napi prepublish -t npm --no-gh-release`
# (the 0.1.2 lesson). Publish platform dirs as `npm publish ./npm/<dir>` —
# a bare `npm/<dir>` parses as GitHub shorthand and dies on ssh.
on:
  push:
    branches: [main]
    tags: ['cachekit-core-ts-v*']
  pull_request:
    branches: [main]
    # Skip the whole workflow for PRs that don't touch the native crate.
    paths:
      - 'packages/cachekit-core-ts/**'
      - '.github/workflows/build-native.yml'
      - '.github/actions/setup-pnpm-node/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  # Push to main and manually pushed cachekit-core-ts-v* tags: full
  # cross-platform validation, the validation a (currently manual, see
  # header) publish relies on.
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Pinned: the published .node binary's glibc floor follows the build image.
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            # Pinned: the published .node binary's glibc floor follows the build image.
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Tag runs build the binaries that get published (see header), so they
      # restore no cache: a cache entry is written by whatever ran before it.
      - uses: ./.github/actions/setup-pnpm-node
        with:
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/cachekit-core-ts
          shared-key: ${{ matrix.target }}

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install dependencies
        run: pnpm install

      - name: Build native module
        working-directory: packages/cachekit-core-ts
        run: |
          pnpm build --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: bindings-${{ matrix.target }}
          path: packages/cachekit-core-ts/*.node
          if-no-files-found: error

  # PRs build the cheap linux-x64 target only (catches the vast majority of
  # compile errors fast), keeping the macOS/Windows cost off the PR review
  # loop. Same steps as build, through the YAML alias. Static matrices only:
  # the runner drift guard in ci.yml reads every runner value as written.
  build-pr:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]

    runs-on: ubuntu-latest

    steps: *build-steps

  # One of build and build-pr is always skipped, which would skip a job that
  # simply needs both; this runs when either one succeeded.
  test:
    needs: [build, build-pr]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build-pr.result == 'success') }}
    strategy:
      matrix:
        node: [22, 24]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-pnpm-node
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ github.ref_type != 'tag' && 'pnpm' || '' }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: packages/cachekit-core-ts

      - name: Install dependencies
        run: pnpm install

      - name: Test native module
        working-directory: packages/cachekit-core-ts
        run: node -e "const m = require('.'); console.log('Version:', m.version())"
