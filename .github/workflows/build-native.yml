name: Build Native

on:
  push:
    branches: [main]
    tags: ['cachekit-core-ts-v*']
  pull_request:
    branches: [main]
    # Skip the whole workflow for PRs that don't touch the native crate.
    paths:
      - 'packages/cachekit-core-ts/**'
      - '.github/workflows/build-native.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.set.outputs.builds }}
    steps:
      - id: set
        # PRs build the cheap linux-x64 target only (catches the vast majority
        # of compile errors on the self-hosted runner). Full cross-platform
        # validation runs on push to main and on release tags, which is what
        # actually gates publication — keeping the macOS/Windows cost off the
        # PR review loop without losing coverage where it matters.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            builds='[{"target":"x86_64-unknown-linux-gnu","os":"cachekit-lean"}]'
          else
            builds='[
              {"target":"x86_64-unknown-linux-gnu","os":"cachekit-lean"},
              {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-latest"},
              {"target":"x86_64-apple-darwin","os":"macos-latest"},
              {"target":"aarch64-apple-darwin","os":"macos-latest"},
              {"target":"x86_64-pc-windows-msvc","os":"windows-latest"}
            ]'
          fi
          echo "builds=$(echo "$builds" | tr -d '\n ')" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.builds) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure Rust paths (self-hosted)
        if: matrix.os == 'cachekit-lean'
        run: |
          echo "RUSTUP_HOME=/tmp/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/tmp/cargo" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install dependencies
        run: pnpm install

      - name: Build native module
        working-directory: packages/cachekit-core-ts
        run: |
          pnpm build --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: bindings-${{ matrix.target }}
          path: packages/cachekit-core-ts/*.node
          if-no-files-found: error

  test:
    needs: build
    strategy:
      matrix:
        os: [cachekit-lean]
        node: [22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: packages/cachekit-core-ts

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Install dependencies
        run: pnpm install

      - name: Test native module
        working-directory: packages/cachekit-core-ts
        run: node -e "const m = require('.'); console.log('Version:', m.version())"

  publish:
    if: startsWith(github.ref, 'refs/tags/cachekit-core-ts-v')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: packages/cachekit-core-ts/artifacts
          merge-multiple: true

      - name: Install dependencies
        run: pnpm install

      - name: Move artifacts to platform packages
        working-directory: packages/cachekit-core-ts
        # @napi-rs/cli v3 renamed --artifacts-dir to --output-dir.
        run: npx napi artifacts --output-dir artifacts

      # napi-rs scaffolds npm/<platform>/package.json files at the
      # version present when `napi build` first ran; they don't update
      # on subsequent version bumps. Without this sync, the platform
      # packages publish at whatever stale version was scaffolded
      # (caught locally during the 0.1.2 bootstrap publish).
      - name: Sync platform package versions to main package version
        working-directory: packages/cachekit-core-ts
        run: npx napi version

      - name: List platform packages
        working-directory: packages/cachekit-core-ts
        run: ls -la npm/*/

      - name: Publish platform packages
        working-directory: packages/cachekit-core-ts
        # The ./ prefix forces local-directory interpretation. Without
        # it, `npm publish npm/darwin-arm64` is treated as the GitHub
        # shorthand <user>/<repo>, attempts ssh://git@github.com/npm/
        # darwin-arm64.git, and fails with Permission denied.
        run: |
          find npm -mindepth 1 -maxdepth 1 -type d -exec npm publish ./{} --access public --provenance \;
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare main package
        working-directory: packages/cachekit-core-ts
        # @napi-rs/cli v3 removed --skip-gh-release; the default is
        # already "no GH release" (opt in via --gh-release if desired).
        run: npx napi prepublish -t npm

      - name: Publish main package
        working-directory: packages/cachekit-core-ts
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
