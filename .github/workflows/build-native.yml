name: Build Native

# This workflow BUILDS and TESTS the native binding. It never publishes.
#
# It runs on PRs (linux-x64 only) and on pushes to main. release-please.yml
# also calls it when it creates a cachekit-core-ts release: the call builds the
# release tag on the full matrix, then release-please.yml packs and publishes
# the six npm packages through OIDC trusted publishing. So the binaries on npm
# come from the same job definition that validates every push to main. Do not
# add a publish job or npm-token auth here: the repo has no npm token, and
# release tags created by the GitHub App trigger no tag-push workflow.
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Release tag to build, as refs/tags/<tag>
        required: true
        type: string
    # One digest per target: release-please.yml checks every downloaded
    # bindings-* artifact against these before it packs anything.
    outputs:
      digest-x86_64-unknown-linux-gnu:
        value: ${{ jobs.build.outputs.digest-x86_64-unknown-linux-gnu }}
      digest-aarch64-unknown-linux-gnu:
        value: ${{ jobs.build.outputs.digest-aarch64-unknown-linux-gnu }}
      digest-x86_64-apple-darwin:
        value: ${{ jobs.build.outputs.digest-x86_64-apple-darwin }}
      digest-aarch64-apple-darwin:
        value: ${{ jobs.build.outputs.digest-aarch64-apple-darwin }}
      digest-x86_64-pc-windows-msvc:
        value: ${{ jobs.build.outputs.digest-x86_64-pc-windows-msvc }}
  pull_request:
    branches: [main]
    # Skip the whole workflow for PRs that don't touch the native crate.
    paths:
      - 'packages/cachekit-core-ts/**'
      - '.github/workflows/build-native.yml'
      - '.github/scripts/digest-files.mjs'
      - '.github/actions/setup-pnpm-node/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0

jobs:
  # Push to main and the release call from release-please.yml: full
  # cross-platform build.
  build:
    if: github.event_name != 'pull_request'
    # Each output is gated on its own leg, so a leg can set no other target's
    # digest; the empty values the other legs produce do not overwrite it.
    outputs:
      digest-x86_64-unknown-linux-gnu: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && steps.digest.outputs.digest || '' }}
      digest-aarch64-unknown-linux-gnu: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && steps.digest.outputs.digest || '' }}
      digest-x86_64-apple-darwin: ${{ matrix.target == 'x86_64-apple-darwin' && steps.digest.outputs.digest || '' }}
      digest-aarch64-apple-darwin: ${{ matrix.target == 'aarch64-apple-darwin' && steps.digest.outputs.digest || '' }}
      digest-x86_64-pc-windows-msvc: ${{ matrix.target == 'x86_64-pc-windows-msvc' && steps.digest.outputs.digest || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Pinned: the published .node binary's glibc floor follows the build image.
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            # Pinned: the published .node binary's glibc floor follows the build image.
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps: &build-steps
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Empty unless release-please.yml called this workflow.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # The release call restores no cache: a cache entry is written by
      # whatever ran before it, and these binaries get published.
      - uses: ./.github/actions/setup-pnpm-node
        with:
          cache: ${{ !inputs.ref && 'pnpm' || '' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        if: ${{ !inputs.ref }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/cachekit-core-ts
          shared-key: ${{ matrix.target }}

      - name: Install aarch64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # --ignore-scripts: napi build needs no dependency install scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native module
        working-directory: packages/cachekit-core-ts
        run: |
          pnpm build --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}

      # The upload carries the binary plus the JS loader and types napi build
      # regenerated, stamped with this version (a release ships linux-x64-gnu's
      # copies). The digest lets release-please.yml check the upload it gets.
      - name: Digest
        id: digest
        shell: bash
        working-directory: packages/cachekit-core-ts
        run: |
          digest=$(node ../../.github/scripts/digest-files.mjs ./*.node index.js index.d.ts)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            packages/cachekit-core-ts/*.node
            packages/cachekit-core-ts/index.js
            packages/cachekit-core-ts/index.d.ts
          if-no-files-found: error

  # PRs build the cheap linux-x64 target only (catches the vast majority of
  # compile errors fast), keeping the macOS/Windows cost off the PR review
  # loop. Same steps as build, through the YAML alias. Static matrices only:
  # the runner drift guard in ci.yml reads every runner value as written.
  build-pr:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]

    runs-on: ubuntu-latest

    steps: *build-steps

  # One of build and build-pr is always skipped, which would skip a job that
  # simply needs both; this runs when either one succeeded.
  test:
    needs: [build, build-pr]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build-pr.result == 'success') }}
    strategy:
      matrix:
        node: [22, 24]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm-node
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ !inputs.ref && 'pnpm' || '' }}

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: packages/cachekit-core-ts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test native module
        working-directory: packages/cachekit-core-ts
        run: node -e "const m = require('.'); console.log('Version:', m.version())"
