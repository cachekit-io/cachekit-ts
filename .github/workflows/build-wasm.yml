name: Build Wasm

# One deterministic wasm32 target — the deliberate contrast to the NAPI
# per-platform matrix in build-native.yml (see cachekit-ts#63 / LAB-595).
#
# Tags only: the ci.yml `workers` job (required via ci-success) already runs
# the identical build:wasm — size budget, version pin, drift check — on every
# PR and main push.
#
# This workflow BUILDS only — it must not publish. ALL wasm publishing goes
# through release-please.yml's publish-cachekit-core-wasm job (pnpm OIDC
# trusted publishing): normal releases via release-please outputs, and
# recovery of an existing tag via the `wasm_tag` workflow_dispatch input.
# Do not re-add a publish job here: the repo has no NPM_TOKEN secret, and
# npm-token auth from this workflow dies ENEEDAUTH (LAB-831 — its single
# lifetime run, on manually pushed tag cachekit-core-wasm-v0.1.1, failed
# exactly that way; the package actually published via release-please.yml).
# GitHub App-created release tags do not trigger this workflow; what remains
# is build validation for manually pushed recovery tags.
on:
  push:
    tags: ['cachekit-core-wasm-v*']

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  # Must match the wasm-bindgen version pinned in the crate's Cargo.lock;
  # scripts/build.sh fails loudly on drift.
  WASM_BINDGEN_VERSION: 0.2.121
  BINARYEN_VERSION: '131'
  # SHA-256 of the release tarballs above (x86_64-linux assets) — the
  # install step refuses to run binaries from a replaced upstream asset.
  WASM_BINDGEN_SHA256: 3039f38f65fe237b640cf06a140c919ca8d717ec5012146d145d3f27bb4d6b28 # pragma: allowlist secret
  BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db # pragma: allowlist secret

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'cachekit-lean' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure Rust paths (self-hosted)
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          echo "RUSTUP_HOME=/tmp/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/tmp/cargo" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          # Pinned (not `stable`) so the published wasm artifact doesn't drift
          # with the runner's toolchain; bump deliberately alongside the
          # size-budget check in scripts/build.sh.
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen + wasm-opt (pinned prebuilts, checksummed)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o /tmp/wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  /tmp/wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          cp "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.local/bin/"
          curl -sSfL -o /tmp/binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar xzf /tmp/binaryen.tar.gz -C /tmp
          cp "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm artifact (size budget + API drift asserted)
        run: pnpm --filter @cachekit-io/cachekit-core-wasm build:wasm
