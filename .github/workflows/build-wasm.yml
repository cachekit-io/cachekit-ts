name: Build Wasm

# One deterministic wasm32 target — the deliberate contrast to the NAPI
# per-platform matrix in build-native.yml (see cachekit-ts#63 / LAB-595).

on:
  push:
    branches: [main]
    tags: ['cachekit-core-wasm-v*']
  pull_request:
    branches: [main]
    # Skip the whole workflow for PRs that don't touch the wasm crate.
    paths:
      - 'packages/cachekit-core-wasm/**'
      - '.github/workflows/build-wasm.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  # Must match the wasm-bindgen version pinned in the crate's Cargo.lock;
  # scripts/build.sh fails loudly on drift.
  WASM_BINDGEN_VERSION: 0.2.121
  BINARYEN_VERSION: '131'

jobs:
  build:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'cachekit-lean' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Configure Rust paths (self-hosted)
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          echo "RUSTUP_HOME=/tmp/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=/tmp/cargo" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen + wasm-opt (pinned prebuilts)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp
          cp "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.local/bin/"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz -C /tmp
          cp "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm artifact (size budget + API drift asserted)
        run: pnpm --filter @cachekit-io/cachekit-core-wasm build:wasm

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: wasm-pkg
          path: packages/cachekit-core-wasm/pkg/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/cachekit-core-wasm-v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-pkg
          path: packages/cachekit-core-wasm/pkg

      - name: Publish
        working-directory: packages/cachekit-core-wasm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
