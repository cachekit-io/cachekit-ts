name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: cachekit-lean
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

  test:
    runs-on: cachekit-lean
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  test-integration:
    runs-on: cachekit  # needs DinD for Redis service container
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run integration tests
        run: pnpm --filter @cachekit-io/cachekit test:integration
        env:
          REDIS_URL: redis://localhost:6379
          CI: true

  coverage:
    runs-on: cachekit-lean
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./packages/cachekit/coverage/lcov.info
          fail_ci_if_error: false

  security:
    runs-on: cachekit-lean
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install

      - name: Audit npm production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
        env:
          CARGO_HOME: /tmp/cargo

      - name: Audit Cargo dependencies
        working-directory: packages/cachekit-core-ts
        run: cargo audit
        env:
          CARGO_HOME: /tmp/cargo

  smoke-test:
    name: Package smoke test (ESM + CJS)
    runs-on: cachekit-lean
    needs: [test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Verify ESM import
        run: |
          node --input-type=module -e "
            import { createCache, ConfigurationError } from './packages/cachekit/dist/index.js';
            const checks = [
              ['createCache', typeof createCache === 'function'],
              ['createCache.minimal', typeof createCache.minimal === 'function'],
              ['createCache.production', typeof createCache.production === 'function'],
              ['createCache.secure', typeof createCache.secure === 'function'],
              ['createCache.io', typeof createCache.io === 'function'],
              ['ConfigurationError', typeof ConfigurationError === 'function'],
            ];
            const failed = checks.filter(([, ok]) => !ok);
            if (failed.length) {
              console.error('ESM export check failed:', failed.map(([n]) => n));
              process.exit(1);
            }
            console.log('ESM: all exports verified');
          "

      - name: Verify CJS require
        run: |
          node -e "
            const m = require('./packages/cachekit/dist/cjs/index.js');
            const checks = [
              ['createCache', typeof m.createCache === 'function'],
              ['createCache.minimal', typeof m.createCache.minimal === 'function'],
              ['createCache.production', typeof m.createCache.production === 'function'],
              ['createCache.secure', typeof m.createCache.secure === 'function'],
              ['createCache.io', typeof m.createCache.io === 'function'],
              ['ConfigurationError', typeof m.ConfigurationError === 'function'],
            ];
            const failed = checks.filter(([, ok]) => !ok);
            if (failed.length) {
              console.error('CJS export check failed:', failed.map(([n]) => n));
              process.exit(1);
            }
            console.log('CJS: all exports verified');
          "

  ci-success:
    name: CI Success
    runs-on: cachekit-lean
    needs: [lint, test, test-integration, coverage, security, smoke-test]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.test-integration.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs succeeded"
