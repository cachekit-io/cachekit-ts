name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-pnpm-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-pnpm-node
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  test-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-pnpm-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run integration tests
        run: pnpm --filter @cachekit-io/cachekit test:integration
        env:
          REDIS_URL: redis://localhost:6379
          CI: true

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Codecov OIDC
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-pnpm-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test with coverage
        run: pnpm test:coverage

      # fail_ci_if_error is also the wrapper's signature-enforcement switch: with
      # false, a failed `gpg --verify` of the CLI's SHA256SUM is only logged and
      # the unverified binary still executes — which v6.0.0 did on every run after
      # Codecov moved its public key off the keybase account v6.0.0 fetched it
      # from (codecov/codecov-action#1956, 2026-06-07). Keep it true so the step
      # aborts before exec; continue-on-error keeps the upload from reddening CI.
      # When this step is orange, read the log: "Could not verify signature" is
      # the guard working (never silence it); an upload error (token, network)
      # only loses that upload. Codecov requires a token on any same-repo branch
      # (its error says "protected"). use_oidc mints one per run via the job's
      # id-token: write, so no stored secret. Forks never attempt OIDC and upload
      # tokenless; "Token required" on a same-repo run means OIDC did not mint.
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        continue-on-error: true
        with:
          files: ./packages/cachekit/coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-pnpm-node

      # Holds where renovate.json's approval gate cannot: vulnerability-
      # remediation updates bypass that gate (why: CONTRIBUTING.md). Runs before
      # `pnpm install` so no install script can rewrite the file first.
      - name: Verify bounded floor-pins stay in-major
        run: |
          set -euo pipefail
          # Declared bounds, "<package> <upper-bound major>". Adding or removing
          # a bounded pin means editing this list — that edit IS the human
          # decision the bound represents.
          expected='brace-expansion@2 3
          js-yaml 5
          protobufjs 8
          uuid 12'
          expected=$(printf '%s\n' "${expected}" | sort)

          # Read the overrides through pnpm's own parser — exactly what install
          # applies, however the YAML is spelled; a file pnpm cannot read fails
          # the step. Keep ONLY a plain `>=floor <N` value, floor and bound at
          # most three parts, the bound written <N, <N.0 or <N.0.0. Anything
          # else — `<12.1` (admits 12.0.x), `<12.0.0.0` (invalid, so semver drops
          # it), a `||` union, a missing bound — drops out of `found` and fails
          # the comparison. A key with whitespace could forge extra lines, so fail.
          overrides=$(pnpm config get overrides --json)
          found=$(printf '%s' "${overrides}" | node -e '
            const o = JSON.parse(require("fs").readFileSync(0, "utf8") || "{}") ?? {};
            for (const [k, v] of Object.entries(o)) {
              if (/\s/.test(k)) throw new Error("override key contains whitespace: " + JSON.stringify(k));
              const m = /^>=\d+(?:\.\d+){0,2}\s+<(\d+)(?:\.0){0,2}$/.exec(String(v));
              if (m) console.log(k + " " + m[1]);
            }' | sort)

          if [ "${found}" != "${expected}" ]; then
            echo "::error::Bounded floor-pins in pnpm-workspace.yaml no longer match the set this check declares. A bound is a deliberate constraint, not drift (see the notes beside each pin, and CONTRIBUTING.md). If crossing a major is genuinely required, remove the bound in a hand-written commit that says why and update the expected list in this step."
            echo "--- expected ---"; printf '%s\n' "${expected}"
            echo "--- found ---";    printf '%s\n' "${found:-(none — pnpm reports no bounded overrides)}" | sed 's/^/  /'
            exit 1
          fi
          echo "Bounded floor-pins verified (package upper-bound-major):"
          printf '%s\n' "${found}" | sed 's/^/  /'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm-workspace.yaml ignores GHSA-mh99-v99m-4gvg graph-wide (advisory
      # metadata lags the 2.x backport). That is only sound while every resolved
      # brace-expansion sits on a floor-pinned line — 2.x or 5.x. A third major
      # would be silently un-audited by the step below, so fail here instead of
      # letting the ignore suppress a real advisory. Enforces the SAFETY
      # INVARIANT documented beside the ignore; delete both together.
      - name: Verify brace-expansion advisory-ignore invariant
        run: |
          set -euo pipefail
          # `|| true`: no match makes grep exit 1, which under pipefail would
          # abort the step with no message. Let the empty case reach the
          # explicit branch below so the failure explains itself.
          majors=$(grep -oE '^  brace-expansion@[0-9]+\.' pnpm-lock.yaml \
                   | sed -E 's#.*@([0-9]+)\.#\1#' | sort -u || true)
          if [ -z "${majors}" ]; then
            echo "::error::brace-expansion no longer resolves in pnpm-lock.yaml. The GHSA-mh99-v99m-4gvg ignore and its overrides in pnpm-workspace.yaml are now dead config — remove them."
            exit 1
          fi
          unexpected=$(printf '%s\n' "${majors}" | grep -vxE '2|5' || true)
          if [ -n "${unexpected}" ]; then
            echo "::error::brace-expansion major(s) outside the floor-pinned 2.x/5.x lines resolved: $(printf '%s' "${unexpected}" | tr '\n' ' '). The graph-wide GHSA-mh99-v99m-4gvg ignore in pnpm-workspace.yaml no longer holds — floor-pin the new line via overrides, or drop the ignore and re-justify."
            exit 1
          fi
          echo "brace-expansion majors resolved: $(printf '%s' "${majors}" | tr '\n' ' ')— invariant holds"

      - name: Audit production dependencies (blocking)
        run: pnpm audit --prod --audit-level=high

      # Production deps are the blocking gate (step above). Dev-only transitive
      # advisories (e.g. tmp <0.2.6 path traversal, build-time tooling) are
      # reported for visibility but must not block CI — they ship to no user.
      # No --audit-level here on purpose: this step cannot fail the build, so a
      # severity floor buys nothing and only hides findings. It used to inherit
      # `high`, which is why the medium uuid advisory (GHSA-w5hq-g745-h8pq) was
      # invisible to CI until someone read the Dependabot list by hand — and
      # transitive advisories have no bot, so this step is the discovery lane.
      - name: Audit all dependencies (non-blocking)
        run: pnpm audit
        continue-on-error: true

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo dependencies
        working-directory: packages/cachekit-core-ts
        run: cargo audit

  workers:
    name: Workers lane (wasm + workerd)
    runs-on: ubuntu-latest
    env:
      # Must match the wasm-bindgen version pinned in the crate's Cargo.lock;
      # scripts/build.sh fails loudly on drift.
      WASM_BINDGEN_VERSION: 0.2.121
      BINARYEN_VERSION: '131'
      # SHA-256 of the release tarballs above (x86_64-linux assets) — the
      # install step refuses to run binaries from a replaced upstream asset.
      WASM_BINDGEN_SHA256: 3039f38f65fe237b640cf06a140c919ca8d717ec5012146d145d3f27bb4d6b28 # pragma: allowlist secret
      BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db # pragma: allowlist secret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-pnpm-node

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          # Pinned (not `stable`) so the published wasm artifact doesn't drift
          # with the runner's toolchain; bump deliberately alongside the
          # size-budget check in scripts/build.sh.
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/cachekit-core-wasm

      - name: Install wasm-bindgen + wasm-opt (pinned prebuilts, checksummed)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o /tmp/wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  /tmp/wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          cp "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.local/bin/"
          curl -sSfL -o /tmp/binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar xzf /tmp/binaryen.tar.gz -C /tmp
          cp "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm artifact (size budget + API drift asserted)
        run: pnpm --filter @cachekit-io/cachekit-core-wasm build:wasm

      - name: Build SDK
        run: pnpm --filter @cachekit-io/cachekit build

      - name: Workers bundle guard (no node:*, NAPI, ioredis, prom-client)
        run: pnpm --filter @cachekit-io/cachekit check:workers-bundle

      - name: Workers tests (protocol vectors + smoke inside workerd)
        run: pnpm --filter @cachekit-io/cachekit test:workers

  smoke-test:
    name: Package smoke test (ESM + CJS)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/setup-pnpm-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify ESM import
        run: |
          node --input-type=module -e "
            import { createCache, ConfigurationError } from './packages/cachekit/dist/index.js';
            const checks = [
              ['createCache', typeof createCache === 'function'],
              ['createCache.minimal', typeof createCache.minimal === 'function'],
              ['createCache.production', typeof createCache.production === 'function'],
              ['createCache.secure', typeof createCache.secure === 'function'],
              ['createCache.io', typeof createCache.io === 'function'],
              ['ConfigurationError', typeof ConfigurationError === 'function'],
            ];
            const failed = checks.filter(([, ok]) => !ok);
            if (failed.length) {
              console.error('ESM export check failed:', failed.map(([n]) => n));
              process.exit(1);
            }
            console.log('ESM: all exports verified');
          "

      - name: Verify CJS require
        run: |
          node -e "
            const m = require('./packages/cachekit/dist/cjs/index.js');
            const checks = [
              ['createCache', typeof m.createCache === 'function'],
              ['createCache.minimal', typeof m.createCache.minimal === 'function'],
              ['createCache.production', typeof m.createCache.production === 'function'],
              ['createCache.secure', typeof m.createCache.secure === 'function'],
              ['createCache.io', typeof m.createCache.io === 'function'],
              ['ConfigurationError', typeof m.ConfigurationError === 'function'],
            ];
            const failed = checks.filter(([, ok]) => !ok);
            if (failed.length) {
              console.error('CJS export check failed:', failed.map(([n]) => n));
              process.exit(1);
            }
            console.log('CJS: all exports verified');
          "

  # This repo is public and forkable, so every job runs on GitHub-hosted
  # runners, never on self-hosted ones. Allow-list, not deny-list: a deny-list
  # cannot see a label it has no name for. The program is the heredoc below;
  # its regression fixtures, .github/scripts/runner-drift-guard-selftest.sh,
  # fail the job whenever the program gets one wrong. This is drift protection
  # for maintainers, not a fork-PR control: a fork PR runs its own copy of this
  # workflow.
  runner-drift-guard:
    name: Runner drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # The program stays in this workflow file on purpose: GITHUB_TOKEN cannot
      # write .github/workflows/, so a `contents: write` job (release-please) or
      # a compromised action could rewrite a script under .github/scripts/ but
      # not this heredoc. It is written to a temp file so the self-test and the
      # scan run the same bytes.
      - name: Write the guard program
        run: |
          cat > "$RUNNER_TEMP/runner-drift-guard.awk" <<'AWK'
            # Allow-list, fail closed: every runs-on value, and every os or
            # runner value inside a matrix block, must be one of the exact
            # hosted labels in HOSTED or the matrix.os expression. This is a
            # line scanner, not a YAML parser: a line that could hide a runner
            # label from it is an error, never a skip. Exact labels, not a
            # hosted-prefix pattern (a prefix admits any self-hosted label named
            # ubuntu-<anything>) and not a copy of GitHub's image table (it
            # rots): adopting another hosted image is a deliberate edit to HOSTED.
            function fail(file, line, msg) {
              printf "::error file=%s,line=%d::%s\n", file, line, msg
              bad = 1
            }
            function label(v) {
              fail(FILENAME, FNR, "runner value \"" v "\" is not an allow-listed GitHub-hosted label — this public repo runs only on GitHub-hosted runners; adopting a new hosted image means extending HOSTED in the runner-drift-guard job of ci.yml")
            }
            # Verdict on the one dynamic matrix the guard accepts (see the
            # build-native.yml rules below), given at the end of each file so the
            # job order does not matter.
            function resolve_refuse() {
              fail(FILENAME, FNR, "the build-matrix resolve job may hold only lines the drift guard can check — write its JSON as builds='<literal>'; a new line there is a deliberate edit to resolve_yaml() or resolve_shell() in the runner-drift-guard job of ci.yml")
            }
            function dynamic_matrix_verdict() {
              if (dyn_line && !dyn_os) fail(dyn_file, dyn_line, "the build matrix comes from the resolve job, which writes no \"os\" literal the drift guard can check — write each entry as \"os\":\"<label>\"")
              dyn_line = 0
            }
            # The only lines build-native.yml's resolve job may hold, besides
            # comment lines and the content of an open builds='...' literal:
            # resolve_yaml() for the job's YAML, resolve_shell() inside a
            # `run: |` block. Any other line (a file read, a generated matrix,
            # a step env, shell, container or action) could set the matrix to a
            # value the guard cannot check, so a new line there is a deliberate
            # edit here.
            function resolve_yaml(s) {
              return s ~ /^[[:space:]]*(matrix|outputs|steps):[[:space:]]*$/ ||
                s ~ /^[[:space:]]*(-[[:space:]]+)?(name|runs-on):/ ||
                s ~ /^[[:space:]]*builds: \$\{\{ steps\.set\.outputs\.builds \}\}[[:space:]]*$/ ||
                s ~ /^[[:space:]]*(-[[:space:]]+)?(id: set|run: \|)[[:space:]]*$/
            }
            function resolve_shell(s) {
              return s ~ /^[[:space:]]*if \[ "\$\{\{ github\.event_name \}\}" = "pull_request" \]; then[[:space:]]*$/ ||
                s ~ /^[[:space:]]*(else|fi)[[:space:]]*$/ ||
                s ~ /^[[:space:]]*builds='[^$'\\]*'?[[:space:]]*$/ ||
                s ~ /^[[:space:]]*echo "builds=\$\(echo "\$builds" \| tr -d '\\n '\)" >> "\$GITHUB_OUTPUT"[[:space:]]*$/
            }
            # Checks one line of the resolve job. A line indented deeper than
            # the `run: |` above it is shell, read raw because a # there may sit
            # inside a quote; any other line is YAML, read comment-stripped, and
            # ends the run: block. A builds='...' literal must close inside its
            # block, or the YAML after it would be read as literal text. The
            # JSON is single-quoted literal text (no $, so no expression; no \,
            # so no JSON escape), and every "os" in it must be a quoted hosted
            # label. Checked pairs are cut from the line so the flow-mapping
            # rule below does not refuse them.
            function resolve_line(   r, v, n, json) {
              if (run_indent < 0 || indent <= run_indent) {
                if (lit) fail(FILENAME, FNR, "the builds='...' literal above is not closed inside its run: block")
                lit = 0; run_indent = -1
                if (!resolve_yaml($0)) resolve_refuse()
                else if (/^[[:space:]]*(-[[:space:]]+)?run: \|[[:space:]]*$/) run_indent = indent
                return
              }
              r = tolower(raw)
              n = gsub(/'/, "'", r)
              json = lit || raw ~ /^[[:space:]]*builds='/
              if (lit ? raw !~ /^[^$'\\]*'?[[:space:]]*$/ : !resolve_shell(raw)) resolve_refuse()
              if (json) lit = lit ? !n : n == 1
              while (json && match(r, /"os"[[:space:]]*:[[:space:]]*"[^"]*"/)) {
                v = substr(r, RSTART, RLENGTH); sub(/^[^:]*:[[:space:]]*"/, "", v); sub(/"$/, "", v)
                if (v ~ HOSTED) dyn_os = 1; else label(v)
                r = substr(r, 1, RSTART - 1) substr(r, RSTART + RLENGTH)
              }
              if (json && r ~ /(^|[^a-z0-9_-])os([^a-z0-9_-]|$)/) fail(FILENAME, FNR, "\"os\" in the build-matrix resolve job is not a literal the drift guard can check — write each entry as \"os\":\"<label>\"")
              $0 = lraw = r
            }
            BEGIN { HOSTED = "^(ubuntu|macos|windows)-latest$" }
            FNR == 1 {
              dynamic_matrix_verdict()
              matrix_indent = strategy_indent = value_indent = run_indent = -1; in_jobs = dyn_os = lit = 0; job = ""
              bn = (FILENAME ~ /(^|\/)build-native\.yml$/)
            }
            # A # starts a YAML comment only at the start of a line or after
            # whitespace; ubuntu-latest#x is one plain scalar. The strip cannot
            # tell a quoted " #" from a comment, so the refusal rules that look
            # for a flow key or an expression read lraw, the unstripped line.
            { sub(/\r$/, ""); raw = $0; lraw = tolower(raw); sub(/(^|[[:space:]])#.*/, ""); $0 = tolower($0) }
            /^[[:space:]]*$/ { if (lit) resolve_line(); next }
            {
              match($0, /^[[:space:]]*(-[[:space:]]*)?/)
              indent = RLENGTH
              if (matrix_indent >= 0 && indent <= matrix_indent) matrix_indent = -1
              if (strategy_indent >= 0 && indent <= strategy_indent) strategy_indent = -1
            }
            # A line deeper than the runner key before it continues that value
            # (a wrapped plain scalar), so the key line held only part of it.
            value_indent >= 0 {
              if (indent > value_indent) fail(FILENAME, FNR, "runner value continues on this line — write it on one line after the key")
              value_indent = -1
            }
            # Job ids: build-native.yml's rules below key on them, and a job
            # named matrix or strategy opens no block.
            /^jobs[[:space:]]*:[[:space:]]*$/ { in_jobs = 1; job_indent = -1; next }
            in_jobs && indent == 0 { in_jobs = 0; job = "" }
            in_jobs && job_indent < 0 { job_indent = indent }
            { job_line = in_jobs && indent == job_indent }
            job_line { job = $0; sub(/^[[:space:]]*/, "", job); sub(/[[:space:]]*:.*/, "", job); lit = 0; run_indent = -1 }
            # Track the strategy and matrix blocks by indentation: a bare os: or
            # runner: is validated only in a matrix, because the same key names a
            # workflow_dispatch input or an action with: parameter, which select
            # no runner. Each tracker arms on a bare key line and does not re-arm
            # while its block is open, so a matrix axis named matrix does not
            # move it. Anything else on the key line (an expression, anchor,
            # alias, tag or flow map) leaves the block unread, so the refusal
            # rule below rejects the line instead.
            !job_line && strategy_indent < 0 && /^[[:space:]]*(-[[:space:]]*)?["']?strategy["']?[[:space:]]*:[[:space:]]*$/ { strategy_indent = indent }
            !job_line && matrix_indent < 0 && /^[[:space:]]*(-[[:space:]]*)?["']?matrix["']?[[:space:]]*:[[:space:]]*$/ { matrix_indent = indent }
            # build-native.yml builds its matrix as JSON in its `matrix` job and
            # reads it in its `build` job.
            bn && job == "matrix" { resolve_line() }
            # The build job's include of that JSON is the one dynamic matrix the
            # guard accepts; dynamic_matrix_verdict() fails it unless the resolve
            # job wrote at least one checked "os" literal. The same line anywhere
            # else falls through to the refusal rule.
            bn && job == "build" && matrix_indent >= 0 && /^[[:space:]]*include[[:space:]]*:[[:space:]]*\$\{\{[[:space:]]*fromjson\(needs\.matrix\.outputs\.builds\)[[:space:]]*\}\}[[:space:]]*$/ {
              dyn_line = FNR; dyn_file = FILENAME; next
            }
            # Lines that may hide a runner label: a flow mapping carrying a
            # runner/strategy/matrix key; strategy: or matrix: with any inline
            # value, include: with one inside a matrix; a YAML merge key or a bare
            # alias item; inside a strategy block, any line holding an expression,
            # whatever precedes it (a strategy, matrix, include or axis value set
            # by one, inline or on the line below its key, behind a quote, flow
            # list, anchor or tag), so an expression-valued axis is a deliberate
            # edit here; a job calling a reusable workflow in another repo (its
            # runs-on is outside this scan; same-repo ./.github/workflows/ and
            # $/.github/workflows/ callees are scanned). Accepted false positives,
            # all fail-closed: an env/with key named matrix or strategy with an
            # inline value; a flow map with an os or runner key; any expression
            # under a bare strategy: line, whatever key holds it (fail-fast,
            # max-parallel, a non-runner axis, an include or exclude value); a
            # trailing comment that holds a flow key or, under strategy:, an
            # expression.
            lraw ~ /[{,][[:space:]]*["']?(runs-on|os|runner|strategy|matrix|include)["']?[[:space:]]*:/ ||
            /^[[:space:]]*(-[[:space:]]*)?["']?(strategy|matrix)["']?[[:space:]]*:[[:space:]]*[^[:space:]]/ ||
            (/^[[:space:]]*(-[[:space:]]*)?["']?include["']?[[:space:]]*:[[:space:]]*[^[:space:]]/ && matrix_indent >= 0) ||
            /^[[:space:]]*(-[[:space:]]*)?(<<[[:space:]]*:|\*[^*[:space:]])/ ||
            (lraw ~ /\$\{\{/ && strategy_indent >= 0) ||
            (/^[[:space:]]*uses[[:space:]]*:/ && /\/\.github\/workflows\// && !/uses[[:space:]]*:[[:space:]]*["']?[.$]\/\.github\/workflows\//) {
              fail(FILENAME, FNR, "line may hide a runner label from the drift guard — write `runs-on: <label>` / `os: [<labels>]` inline; keep `strategy:`, `matrix:`, `include:` as bare keys over a static block (no expression anywhere under strategy:, no anchors, aliases or flow maps); call reusable workflows only from ./.github/workflows/ or $/.github/workflows/")
            }
            /^[[:space:]]*(-[[:space:]]*)?["']?runs-on["']?[[:space:]]*:/ ||
            (/^[[:space:]]*(-[[:space:]]*)?["']?(os|runner)["']?[[:space:]]*:/ && matrix_indent >= 0) {
              v = $0; sub(/^[^:]*:[[:space:]]*/, "", v); sub(/[[:space:]]+$/, "", v)
              if (v != "") value_indent = indent
              if (v ~ /^["']?\$\{\{[[:space:]]*matrix\.os[[:space:]]*\}\}["']?$/) next
              # An unclosed list or quote was wrapped, or cut by a # inside it.
              if (v ~ /^\[/ && v !~ /\]$/ || gsub(/"/, "&", v) % 2 || gsub(/'/, "&", v) % 2) v = ""
              gsub(/[][ "']/, "", v)
              n = split(v, items, ",")
              ok = (v != "")
              for (i = 1; i <= n; i++) if (items[i] !~ HOSTED) ok = 0
              if (!ok) label(v == "" ? "<value not inline on this line>" : v)
            }
            END { dynamic_matrix_verdict(); exit bad }
          AWK

      # One awk pass, no shell pipeline: a program error exits non-zero and
      # fails the step instead of reading as "no match". dotglob, because
      # GitHub runs a dot-prefixed workflow file too; with no file to match,
      # the pattern stays literal and awk fails to open it.
      - name: Every runner value is an allow-listed GitHub-hosted label
        run: |
          shopt -s dotglob
          awk -f "$RUNNER_TEMP/runner-drift-guard.awk" .github/workflows/*.y*ml

      # After the scan, not before: the script lives under .github/scripts/,
      # which a `contents: write` job can rewrite, so it must not run ahead of
      # the scan with the program's path in hand. It still fails the job when
      # the program gets any fixture wrong, and it runs when the scan fails too,
      # so a program edit that breaks the real tree still shows which fixture
      # broke; the scan's result is already recorded by then.
      - name: Guard self-test (regression fixtures)
        if: ${{ !cancelled() }}
        run: bash .github/scripts/runner-drift-guard-selftest.sh "$RUNNER_TEMP/runner-drift-guard.awk"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [lint, test, test-integration, coverage, security, smoke-test, workers, runner-drift-guard]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.test-integration.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.smoke-test.result }}" != "success" ]] || \
             [[ "${{ needs.workers.result }}" != "success" ]] || \
             [[ "${{ needs.runner-drift-guard.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs succeeded"
