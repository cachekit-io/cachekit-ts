name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release build (use existing tag)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      wasm_tag:
        description: 'Existing cachekit-core-wasm tag to publish (recovery only)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # cachekit outputs
      cachekit--release_created: ${{ steps.release.outputs['packages/cachekit--release_created'] }}
      cachekit--tag_name: ${{ steps.release.outputs['packages/cachekit--tag_name'] }}
      cachekit--version: ${{ steps.release.outputs['packages/cachekit--version'] }}
      # cachekit-core-ts outputs — currently unconsumed: App-created tags do
      # NOT trigger build-native.yml's push workflow, and core-ts publishing
      # is manual today (see build-native.yml's header; a CI publish path
      # consuming these outputs is LAB-1390's follow-up).
      core-ts--release_created: ${{ steps.release.outputs['packages/cachekit-core-ts--release_created'] }}
      core-ts--tag_name: ${{ steps.release.outputs['packages/cachekit-core-ts--tag_name'] }}
      # cachekit-core-wasm publishes here because tags created by the GitHub
      # App do not trigger build-wasm.yml's push workflow.
      core-wasm--release_created: ${{ steps.release.outputs['packages/cachekit-core-wasm--release_created'] }}
      core-wasm--tag_name: ${{ steps.release.outputs['packages/cachekit-core-wasm--tag_name'] }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          token: ${{ steps.app-token.outputs.token }}

      - name: Assign release PR
        if: ${{ steps.release.outputs.pr }}
        run: gh pr edit "${{ fromJson(steps.release.outputs.pr).number }}" --repo "${{ github.repository }}" --add-assignee 27Bslash6
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  publish-cachekit:
    name: Publish @cachekit-io/cachekit
    needs: release-please
    if: needs.release-please.outputs.cachekit--release_created == 'true' || github.event.inputs.force_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      id-token: write

    steps:
      # The tag path needs no check: release-please only tags commits on main,
      # where "CI Success" is a required check. A force_release dispatch
      # produces no tag, so the checkout below falls back to github.sha — the
      # tip of whatever ref was selected at dispatch, which may never have
      # passed CI. Verify that commit before any step can mint the OIDC token.
      # Keying off the empty tag (not the force_release input) targets exactly
      # the case where the fallback is taken. This is an API query, so unlike
      # the test step it replaces, it runs no dependency code beside the token.
      - name: Verify CI passed for forced publish
        if: needs.release-please.outputs.cachekit--tag_name == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # check_name filters server-side so the default 30-item page cannot
          # hide the run we need — a commit on main accumulates check-runs from
          # every workflow plus the ci.yml node matrix and any re-runs.
          # --paginate --slurp keeps it correct even past 100 re-runs of that
          # one check. Both halves are load-bearing: --paginate alone applies
          # gh's own --jq once per page and concatenates the results, which
          # would make $conclusion multi-line and never equal "success"; and
          # --slurp is rejected by gh when combined with --jq, so the filter
          # has to run in a piped jq (preinstalled on ubuntu-latest).
          conclusion=$(gh api --paginate --slurp \
            "repos/$REPO/commits/$SHA/check-runs?check_name=CI+Success&per_page=100" \
            | jq -r '[.[].check_runs[]] | sort_by(.started_at) | last | .conclusion // "missing"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to publish $SHA — 'CI Success' is '$conclusion', not 'success'."
            exit 1
          fi
          echo "CI Success verified for $SHA"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.cachekit--tag_name || github.sha }}
          # Publish-only job (no git writes); don't leave the token on disk.
          persist-credentials: false

      # No `registry-url`: it writes a token-era .npmrc whose
      # `_authToken=${NODE_AUTH_TOKEN}` placeholder has no env to resolve
      # (pnpm: `[WARN] Failed to replace env in config`). pnpm publishes to its
      # default registry (registry.npmjs.org) and OIDC supplies the auth.
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      # This job can mint the npm OIDC publish token. --ignore-scripts closes
      # the wormable install-time vector (Shai-Hulud-class lifecycle scripts,
      # including pnpm-workspace.yaml's allowBuilds allowlist — nothing here
      # needs them); --frozen-lockfile pins the graph to what CI verified.
      # The build below still executes dependency code beside the token, so
      # exposure is narrowed, not closed — the structural fix is build/publish
      # job separation (LAB-2731).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # No test step: ci.yml already ran build+test on this exact commit, and
      # every extra step here runs dependency code beside the OIDC token. That
      # holds on the tag path via the required "CI Success" check on main, and
      # on the forced path via the verification step above.
      - name: Build
        run: pnpm build

      # Auth is npm OIDC trusted publishing via a package-level trusted
      # publisher on npmjs.com — the repo has NO npm token secret (LAB-831).
      - name: Publish to npm
        working-directory: packages/cachekit
        run: pnpm publish --access public --provenance --no-git-checks

  publish-cachekit-core-wasm:
    name: Publish @cachekit-io/cachekit-core-wasm
    needs: release-please
    if: needs.release-please.outputs.core-wasm--release_created == 'true' || github.event.inputs.wasm_tag != ''
    runs-on: ubuntu-latest
    # Serialize publishes of the same wasm tag so an in-flight automatic
    # release-please run and a manual `wasm_tag` recovery dispatch can't race
    # into duplicate npm publishes. Different tags still publish in parallel.
    concurrency:
      group: publish-cachekit-core-wasm-${{ needs.release-please.outputs.core-wasm--tag_name || github.event.inputs.wasm_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.core-wasm--tag_name || github.event.inputs.wasm_tag }}
          # Publish-only job (no git writes); don't leave the token on disk.
          persist-credentials: false

      # No `registry-url` — same reason as publish-cachekit.
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen + wasm-opt (pinned prebuilts, checksummed)
        env:
          WASM_BINDGEN_VERSION: 0.2.121
          BINARYEN_VERSION: '131'
          WASM_BINDGEN_SHA256: 3039f38f65fe237b640cf06a140c919ca8d717ec5012146d145d3f27bb4d6b28 # pragma: allowlist secret
          BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db # pragma: allowlist secret
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o /tmp/wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  /tmp/wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          cp "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.local/bin/"
          curl -sSfL -o /tmp/binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar xzf /tmp/binaryen.tar.gz -C /tmp
          cp "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --ignore-scripts: same OIDC-exposure rule as publish-cachekit; build.sh
      # is pure cargo/wasm-bindgen/wasm-opt and needs no dependency scripts.
      # cargo build.rs/proc-macros still run beside the token — LAB-2731.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build wasm artifact
        run: pnpm --filter @cachekit-io/cachekit-core-wasm build:wasm

      # Auth is npm OIDC trusted publishing — the repo has NO NPM_TOKEN secret
      # (the old token-auth steps resolved an empty token and died ENEEDAUTH,
      # LAB-831). Node 22's bundled npm 10 cannot do OIDC; pnpm 11 can, and
      # this is the exact invocation the proven publish-cachekit job uses.
      # Bootstrapping a NEW package: trusted publishers are package-level and
      # can only be configured once the package exists (npm/cli#8544), so the
      # first publish must be a one-off credentialed/manual publish; configure
      # the package-level trusted publisher after that and OIDC takes over.
      - name: Publish to npm
        working-directory: packages/cachekit-core-wasm
        run: pnpm publish --access public --provenance --no-git-checks
