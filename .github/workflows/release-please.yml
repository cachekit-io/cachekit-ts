name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release build (use existing tag)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      wasm_tag:
        description: 'Existing cachekit-core-wasm tag to publish (recovery only)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # cachekit outputs
      cachekit--release_created: ${{ steps.release.outputs['packages/cachekit--release_created'] }}
      cachekit--tag_name: ${{ steps.release.outputs['packages/cachekit--tag_name'] }}
      cachekit--version: ${{ steps.release.outputs['packages/cachekit--version'] }}
      # cachekit-core-ts outputs (triggers build-native.yml via tag)
      core-ts--release_created: ${{ steps.release.outputs['packages/cachekit-core-ts--release_created'] }}
      core-ts--tag_name: ${{ steps.release.outputs['packages/cachekit-core-ts--tag_name'] }}
      # cachekit-core-wasm publishes here because tags created by the GitHub
      # App do not trigger build-wasm.yml's push workflow.
      core-wasm--release_created: ${{ steps.release.outputs['packages/cachekit-core-wasm--release_created'] }}
      core-wasm--tag_name: ${{ steps.release.outputs['packages/cachekit-core-wasm--tag_name'] }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          token: ${{ steps.app-token.outputs.token }}

      - name: Assign release PR
        if: ${{ steps.release.outputs.pr }}
        run: gh pr edit "${{ fromJson(steps.release.outputs.pr).number }}" --repo "${{ github.repository }}" --add-assignee 27Bslash6
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  publish-cachekit:
    name: Publish @cachekit-io/cachekit
    needs: release-please
    if: needs.release-please.outputs.cachekit--release_created == 'true' || github.event.inputs.force_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.cachekit--tag_name || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        working-directory: packages/cachekit
        run: pnpm publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cachekit-core-wasm:
    name: Publish @cachekit-io/cachekit-core-wasm
    needs: release-please
    if: needs.release-please.outputs.core-wasm--release_created == 'true' || github.event.inputs.wasm_tag != ''
    runs-on: ubuntu-latest
    # Serialize publishes of the same wasm tag so an in-flight automatic
    # release-please run and a manual `wasm_tag` recovery dispatch can't race
    # into duplicate npm publishes. Different tags still publish in parallel.
    concurrency:
      group: publish-cachekit-core-wasm-${{ needs.release-please.outputs.core-wasm--tag_name || github.event.inputs.wasm_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.core-wasm--tag_name || github.event.inputs.wasm_tag }}
          # Publish-only job (no git writes); don't leave the token on disk.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen + wasm-opt (pinned prebuilts, checksummed)
        env:
          WASM_BINDGEN_VERSION: 0.2.121
          BINARYEN_VERSION: '131'
          WASM_BINDGEN_SHA256: 3039f38f65fe237b640cf06a140c919ca8d717ec5012146d145d3f27bb4d6b28 # pragma: allowlist secret
          BINARYEN_SHA256: b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db # pragma: allowlist secret
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o /tmp/wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  /tmp/wasm-bindgen.tar.gz" | sha256sum -c -
          tar xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          cp "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.local/bin/"
          curl -sSfL -o /tmp/binaryen.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar xzf /tmp/binaryen.tar.gz -C /tmp
          cp "/tmp/binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build wasm artifact
        run: pnpm --filter @cachekit-io/cachekit-core-wasm build:wasm

      # Auth is npm OIDC trusted publishing — the repo has NO NPM_TOKEN secret
      # (the old token-auth steps resolved an empty token and died ENEEDAUTH,
      # LAB-831). Node 22's bundled npm 10 cannot do OIDC; pnpm 11 can, and
      # this is the exact invocation the proven publish-cachekit job uses.
      # First-time creation of a new package additionally needs an ORG-level
      # trusted publisher on npmjs.com (package-level config requires the
      # package to already exist — npm/cli#8544).
      - name: Publish to npm
        working-directory: packages/cachekit-core-wasm
        run: pnpm publish --access public --provenance --no-git-checks
