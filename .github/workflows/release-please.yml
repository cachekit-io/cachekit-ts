name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release build (use existing tag)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      wasm_tag:
        description: 'Existing cachekit-core-wasm tag to publish (recovery only)'
        required: false
        type: string
      core_ts_tag:
        description: 'Existing cachekit-core-ts tag to publish, bare name, 0.2.0 or later (recovery only)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # cachekit outputs
      cachekit--release_created: ${{ steps.release.outputs['packages/cachekit--release_created'] }}
      cachekit--tag_name: ${{ steps.release.outputs['packages/cachekit--tag_name'] }}
      cachekit--version: ${{ steps.release.outputs['packages/cachekit--version'] }}
      # cachekit-core-ts publishes here too: see build-cachekit-core-ts-native.
      core-ts--release_created: ${{ steps.release.outputs['packages/cachekit-core-ts--release_created'] }}
      core-ts--tag_name: ${{ steps.release.outputs['packages/cachekit-core-ts--tag_name'] }}
      # cachekit-core-wasm publishes here because tags created by the GitHub
      # App do not trigger build-wasm.yml's push workflow.
      core-wasm--release_created: ${{ steps.release.outputs['packages/cachekit-core-wasm--release_created'] }}
      core-wasm--tag_name: ${{ steps.release.outputs['packages/cachekit-core-wasm--tag_name'] }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          token: ${{ steps.app-token.outputs.token }}

      # outputs.pr is only prs[0]; under separate-pull-requests a cycle can
      # open one PR per package, so iterate outputs.prs (all of them).
      - name: Assign release PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Via env, not inline ${{ }} in the script — the PR JSON carries
          # branch/title text and inline interpolation is an injection vector.
          PRS: ${{ steps.release.outputs.prs }}
        # Explicit `shell: bash` for pipefail, so a jq parse failure fails the
        # step instead of silently assigning nothing.
        shell: bash
        run: |
          jq -r '.[].number' <<<"$PRS" | while read -r pr_number; do
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --add-assignee 27Bslash6
          done

  # Each package is built in a job with NO id-token and published by a job that
  # runs no dependency code. Every step of an `id-token: write` job can mint
  # the npm OIDC token, and npm trusted publishers bind to this workflow file,
  # not to a job — so a compromised build dependency (turbo, tsc, a cargo
  # build.rs or proc-macro) running beside the token could publish ANY package
  # this workflow publishes, at any version. Split, it can only influence the tarball its own
  # build job hands over: the publish job refuses a tarball whose sha256 is not
  # the one that build job reported, or whose name/version or registry (as
  # pnpm itself reads them) is not the package being released on npmjs.org.
  build-cachekit:
    name: Build @cachekit-io/cachekit
    needs: release-please
    if: needs.release-please.outputs.cachekit--release_created == 'true' || github.event.inputs.force_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    permissions:
      contents: read
      checks: read
      pull-requests: read # the release-order gate lists the cores' open release PRs

    steps:
      # The tag path needs no check: release-please only tags commits on main,
      # where "CI Success" is a required check. A force_release dispatch
      # produces no tag, so the checkout below falls back to github.sha — the
      # tip of whatever ref was selected at dispatch, which may never have
      # passed CI. Verify that commit before anything is built for publishing.
      # Keying off the empty tag (not the force_release input) targets exactly
      # the case where the fallback is taken.
      - name: Verify CI passed for forced publish
        if: needs.release-please.outputs.cachekit--tag_name == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # check_name filters server-side so the default 30-item page cannot
          # hide the run we need — a commit on main accumulates check-runs from
          # every workflow plus the ci.yml node matrix and any re-runs.
          # --paginate --slurp keeps it correct even past 100 re-runs of that
          # one check. Both halves are load-bearing: --paginate alone applies
          # gh's own --jq once per page and concatenates the results, which
          # would make $conclusion multi-line and never equal "success"; and
          # --slurp is rejected by gh when combined with --jq, so the filter
          # has to run in a piped jq (preinstalled on ubuntu-latest).
          conclusion=$(gh api --paginate --slurp \
            "repos/$REPO/commits/$SHA/check-runs?check_name=CI+Success&per_page=100" \
            | jq -r '[.[].check_runs[]] | sort_by(.started_at) | last | .conclusion // "missing"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to publish $SHA — 'CI Success' is '$conclusion', not 'success'."
            exit 1
          fi
          echo "CI Success verified for $SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.cachekit--tag_name || github.sha }}
          persist-credentials: false

      # Runs before any dependency code, against the pins the pack below
      # writes. Why, and how to recover from a refusal: CONTRIBUTING.md,
      # Releasing.
      - name: Cores release before the SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-order-gate.mjs packages/cachekit --packing

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      # --ignore-scripts closes the wormable install-time vector (Shai-Hulud-
      # class lifecycle scripts, including pnpm-workspace.yaml's allowBuilds
      # allowlist — nothing here needs them); --frozen-lockfile pins the graph
      # to what CI verified.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # No test step: ci.yml already ran build+test on this exact commit. That
      # holds on the tag path via the required "CI Success" check on main, and
      # on the forced path via the verification step above.
      - name: Build
        run: pnpm build

      # pnpm pack is what `pnpm publish <dir>` runs internally: it rewrites the
      # workspace:* deps to concrete versions, which needs the install above.
      - name: Pack
        id: pack
        working-directory: packages/cachekit
        run: |
          pnpm pack --out "$RUNNER_TEMP/package.tgz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/package.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cachekit-tarball
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish-cachekit:
    name: Publish @cachekit-io/cachekit
    needs: [release-please, build-cachekit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # Nothing in this job may execute dependency code: no install, no build, no
    # test. Checkout is for the packageManager pin and the manifest to verify
    # against; pnpm publishes the prebuilt tarball, running no lifecycle scripts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.cachekit--tag_name || github.sha }}
          persist-credentials: false

      # No `registry-url`: it writes a token-era .npmrc whose
      # `_authToken=${NODE_AUTH_TOKEN}` placeholder has no env to resolve
      # (pnpm: `[WARN] Failed to replace env in config`). pnpm publishes to its
      # default registry (registry.npmjs.org) and OIDC supplies the auth.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cachekit-tarball
          path: ${{ runner.temp }}

      # The tarball came from a job that ran dependency code: pin its digest,
      # identity and target registry before the token is used (see the script).
      - name: Verify tarball
        shell: bash
        env:
          SHA256: ${{ needs.build-cachekit.outputs.sha256 }}
          MANIFEST: packages/cachekit/package.json
        run: .github/scripts/verify-tarball.sh "$RUNNER_TEMP/package.tgz" "$MANIFEST" "$SHA256"

      # Auth is npm OIDC trusted publishing via a package-level trusted
      # publisher on npmjs.com — the repo has NO npm token secret.
      - name: Publish to npm
        run: pnpm publish "$RUNNER_TEMP/package.tgz" --access public --provenance --no-git-checks

  build-cachekit-core-wasm:
    name: Build @cachekit-io/cachekit-core-wasm
    needs: release-please
    if: needs.release-please.outputs.core-wasm--release_created == 'true' || github.event.inputs.wasm_tag != ''
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.core-wasm--tag_name || github.event.inputs.wasm_tag }}
          persist-credentials: false

      # The tool installer comes from this workflow's own commit, not the tag:
      # a recovery `wasm_tag` can predate the action. It installs the
      # wasm-bindgen CLI the tag's Cargo.lock locks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-scripts
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - uses: ./.release-scripts/.github/actions/setup-wasm-tools

      # --ignore-scripts: build.sh is pure cargo/wasm-bindgen/wasm-opt and
      # needs no dependency scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build wasm artifact
        run: pnpm --filter @cachekit-io/cachekit-core-wasm build:wasm

      - name: Pack
        id: pack
        working-directory: packages/cachekit-core-wasm
        run: |
          pnpm pack --out "$RUNNER_TEMP/package.tgz"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/package.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cachekit-core-wasm-tarball
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish-cachekit-core-wasm:
    name: Publish @cachekit-io/cachekit-core-wasm
    needs: [release-please, build-cachekit-core-wasm]
    runs-on: ubuntu-latest
    # Serialize publishes of the same wasm tag so an in-flight automatic
    # release-please run and a manual `wasm_tag` recovery dispatch can't race
    # into duplicate npm publishes. Different tags still publish in parallel.
    concurrency:
      group: publish-cachekit-core-wasm-${{ needs.release-please.outputs.core-wasm--tag_name || github.event.inputs.wasm_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    # Same shape as publish-cachekit: no dependency code runs beside the token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.core-wasm--tag_name || github.event.inputs.wasm_tag }}
          persist-credentials: false

      # The verifier comes from this workflow's own commit, not the tag: a
      # recovery `wasm_tag` can predate verify-tarball.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-scripts
          sparse-checkout: .github/scripts
          persist-credentials: false

      # No `registry-url` — same reason as publish-cachekit.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cachekit-core-wasm-tarball
          path: ${{ runner.temp }}

      # Same pins as publish-cachekit.
      - name: Verify tarball
        shell: bash
        env:
          SHA256: ${{ needs.build-cachekit-core-wasm.outputs.sha256 }}
          MANIFEST: packages/cachekit-core-wasm/package.json
        run: .release-scripts/.github/scripts/verify-tarball.sh "$RUNNER_TEMP/package.tgz" "$MANIFEST" "$SHA256"

      # Auth is npm OIDC trusted publishing — the repo has NO NPM_TOKEN secret
      # (the old token-auth steps resolved an empty token and died ENEEDAUTH).
      # Node 22's bundled npm 10 cannot do OIDC; pnpm 11 can, and
      # this is the exact invocation publish-cachekit uses.
      # Bootstrapping a NEW package: trusted publishers are package-level and
      # can only be configured once the package exists (npm/cli#8544), so the
      # first publish must be a one-off credentialed/manual publish; configure
      # the package-level trusted publisher after that and OIDC takes over.
      - name: Publish to npm
        run: pnpm publish "$RUNNER_TEMP/package.tgz" --access public --provenance --no-git-checks

  # cachekit-core-ts is six npm packages: one per napi target holding that
  # platform's .node binary, and the main package (JS loader, types, all five
  # binaries, and exact-version optionalDependencies on the five). The binaries
  # need macOS and Windows runners, so build-native.yml builds them, called on
  # the release tag: the same job definition builds every push to main. Its
  # jobs run read-only and restore no cache on this call.
  build-cachekit-core-ts-native:
    name: Build @cachekit-io/cachekit-core-ts binaries
    needs: release-please
    if: needs.release-please.outputs.core-ts--release_created == 'true' || github.event.inputs.core_ts_tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-native.yml
    with:
      ref: refs/tags/${{ needs.release-please.outputs.core-ts--tag_name || github.event.inputs.core_ts_tag }}

  build-cachekit-core-ts:
    name: Build @cachekit-io/cachekit-core-ts
    needs: [release-please, build-cachekit-core-ts-native]
    runs-on: ubuntu-latest
    outputs:
      sha256-by-file: ${{ steps.pack.outputs.sha256-by-file }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.core-ts--tag_name || github.event.inputs.core_ts_tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      # --ignore-scripts: the napi CLI below needs no dependency scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bindings-*
          path: ${{ runner.temp }}/bindings

      # Any job in this run can replace an artifact by name, so each target's
      # download must match the digest its build leg reported. The digest is
      # recomputed over exactly the files that target should have uploaded,
      # its binary named by napi's own triple parsing, and only that binary is
      # staged: a leg that also uploads another platform's binary fails the
      # check instead of overwriting it. The targets come from this checkout's
      # napi config, the list napi pre-publish writes into optionalDependencies.
      - name: Verify and stage binaries
        working-directory: packages/cachekit-core-ts
        env:
          DIGESTS: ${{ toJSON(needs.build-cachekit-core-ts-native.outputs) }}
        run: |
          mkdir artifacts
          binary=$(jq -er .napi.binaryName package.json)
          targets=$(jq -er '.napi.targets | select(length > 0) | .[]' package.json)
          for target in $targets; do
            dir="$RUNNER_TEMP/bindings/bindings-$target"
            want=$(jq -r --arg key "digest-$target" '.[$key] // ""' <<<"$DIGESTS")
            if [ -z "$want" ] || [ ! -d "$dir" ]; then
              echo "::error::No build of napi target $target. A target needs a matrix leg in build-native.yml, its digest in both of that file's output maps, and an npm/<platform> package."
              exit 1
            fi
            file="$binary.$(node -p "require('@napi-rs/cli').parseTriple(process.argv[1]).platformArchABI" "$target").node"
            got=$(node ../../.github/scripts/digest-files.mjs "$dir/$file" "$dir/index.js" "$dir/index.d.ts") || got=unreadable
            if [ "$got" != "$want" ]; then
              echo "::error::bindings-$target: the digest of $file, index.js and index.d.ts is '$got', but its build reported '$want'. Refusing to pack."
              exit 1
            fi
            cp "$dir/$file" artifacts/
          done

      # napi build stamps the loader with the package version and regenerates
      # the types from the Rust source; the checked-in copies carry whatever the
      # last local build wrote, so the package ships the ones linux-x64-gnu's
      # build generated (verified above). napi artifacts copies each binary into its npm/<platform>
      # package and into the package root, where `files` ships all five in the
      # main package too, as 0.1.2 did. That keeps the main package loadable
      # when npm skips the platform optionalDependency (npm/cli#4828, fixed
      # only in npm 11.3.0; Node 22 bundles npm 10). napi pre-publish stamps
      # this version into the platform manifests, which napi never bumps on its
      # own, and writes the main package's optionalDependencies on them.
      # --skip-optional-publish stops it running `npm publish` on each one.
      - name: Assemble packages
        working-directory: packages/cachekit-core-ts
        run: |
          cp "$RUNNER_TEMP/bindings/bindings-x86_64-unknown-linux-gnu/index.js" \
            "$RUNNER_TEMP/bindings/bindings-x86_64-unknown-linux-gnu/index.d.ts" .
          pnpm exec napi artifacts
          pnpm exec napi pre-publish -t npm --skip-optional-publish --no-gh-release

      # One tarball per package, named after it, and their sha256s as one JSON
      # map for the publish job to check each against.
      - name: Pack
        id: pack
        working-directory: packages/cachekit-core-ts
        run: |
          out="$RUNNER_TEMP/core-ts"
          mkdir "$out"
          pnpm pack --out "$out/cachekit-core-ts.tgz"
          for dir in npm/*/; do
            (cd "$dir" && pnpm pack --out "$out/cachekit-core-ts-$(basename "$dir").tgz")
          done
          sums=$(cd "$out" && sha256sum -- *.tgz | jq -Rnc '[inputs | split("  ") | {(.[1]): .[0]}] | add')
          echo "sha256-by-file=$sums" >> "$GITHUB_OUTPUT"

      # 30 days, not 7: GitHub allows re-running a run for 30 days, and a
      # re-run of a publish that stopped partway needs these exact bytes (a
      # rebuild's binaries differ, and the publish job refuses them).
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: cachekit-core-ts-tarballs
          path: ${{ runner.temp }}/core-ts
          if-no-files-found: error
          retention-days: 30

  publish-cachekit-core-ts:
    name: Publish @cachekit-io/cachekit-core-ts
    needs: [release-please, build-cachekit-core-ts]
    runs-on: ubuntu-latest
    # Same reason as publish-cachekit-core-wasm.
    concurrency:
      group: publish-cachekit-core-ts-${{ needs.release-please.outputs.core-ts--tag_name || github.event.inputs.core_ts_tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    # Same shape as publish-cachekit: no dependency code runs beside the token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.core-ts--tag_name || github.event.inputs.core_ts_tag }}
          persist-credentials: false

      # No `registry-url` — same reason as publish-cachekit.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cachekit-core-ts-tarballs
          path: ${{ runner.temp }}/core-ts

      # Same pins as publish-cachekit, for all six tarballs before any publish.
      # verify-tarball.sh comes from the tag, unlike in publish-cachekit-core-wasm:
      # a core-ts tag older than 0.2.0 has no build action or scripts, so its
      # build already fails at setup, before anything reaches this job.
      # The package list comes from this checkout, never from the artifact:
      # the main package plus one per npm/<platform> directory, all at the main
      # package's version (the checked-in platform manifests keep the version
      # napi scaffolded them at).
      - name: Verify tarballs
        shell: bash
        env:
          SHA256_BY_FILE: ${{ needs.build-cachekit-core-ts.outputs.sha256-by-file }}
          PKG: packages/cachekit-core-ts
        run: |
          version=$(jq -r .version "$PKG/package.json")
          verify() { # tarball-name manifest
            .github/scripts/verify-tarball.sh "$RUNNER_TEMP/core-ts/$1" "$2" \
              "$(jq -r --arg file "$1" '.[$file] // ""' <<<"$SHA256_BY_FILE")"
          }
          for dir in "$PKG"/npm/*/; do
            platform=$(basename "$dir")
            jq --arg v "$version" '.version = $v' "$dir/package.json" > "$RUNNER_TEMP/$platform.json"
            verify "cachekit-core-ts-$platform.tgz" "$RUNNER_TEMP/$platform.json"
          done
          verify cachekit-core-ts.tgz "$PKG/package.json"

      # Auth is npm OIDC trusted publishing: each of the six packages has its
      # own package-level trusted publisher on npmjs.com for this workflow.
      # Platform packages first: the main package pins each one exactly, so it
      # must not reach npm before they do. A version already on npm with these
      # exact bytes is skipped, so "Re-run failed jobs" finishes a publish that
      # stopped partway; the same version with other bytes fails the job.
      - name: Publish to npm
        shell: bash
        env:
          PKG: packages/cachekit-core-ts
        run: |
          version=$(jq -r .version "$PKG/package.json")
          publish() { # tarball-name package-name
            local tgz="$RUNNER_TEMP/core-ts/$1" ours theirs
            ours="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
            # E404 means not published yet; any other lookup failure stops here.
            theirs=$(npm view "$2@$version" dist.integrity 2>"$RUNNER_TEMP/npm-view.err") ||
              grep -q 'code E404' "$RUNNER_TEMP/npm-view.err" || {
                cat "$RUNNER_TEMP/npm-view.err"
                echo "::error::Could not look up $2@$version on npm — refusing to publish."
                exit 1
              }
            if [ "$theirs" = "$ours" ]; then
              echo "$2@$version is already on npm with these bytes — skipping."
            elif [ -n "$theirs" ]; then
              echo "::error::$2@$version is already on npm as $theirs, not this tarball ($ours) — refusing."
              exit 1
            else
              pnpm publish "$tgz" --access public --provenance --no-git-checks
            fi
          }
          for dir in "$PKG"/npm/*/; do
            publish "cachekit-core-ts-$(basename "$dir").tgz" "$(jq -r .name "$dir/package.json")"
          done
          publish cachekit-core-ts.tgz "$(jq -r .name "$PKG/package.json")"
