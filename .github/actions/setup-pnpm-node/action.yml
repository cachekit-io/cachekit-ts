name: Setup pnpm + Node.js (cached)
description: >-
  Install pnpm, then Node.js with the pnpm store cache wired in
  (pnpm must be on PATH before actions/setup-node's cache: pnpm probe runs).
inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '22'
  cache:
    description: actions/setup-node package-manager cache; '' disables it
    required: false
    default: pnpm
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v2

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
