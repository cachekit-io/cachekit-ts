# wasm32 build of cachekit-core for Cloudflare Workers (LAB-595).
#
# Same pinned cachekit-core as the NAPI crate (../cachekit-core-ts) — one
# touchpoint for all core persistence/encryption changes. The `encryption`
# feature pulls the pure-Rust aes-gcm path on wasm32 (ring is native-only)
# and getrandom's `js` feature for crypto.getRandomValues.
#
# wasm-bindgen is exact-pinned: the CLI that post-processes the artifact must
# match this version (see package.json build script and CI).
[package]
name = "cachekit-core-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.121"
# js-sys ships from the wasm-bindgen workspace and tracks its ABI; needed to
# accept Uint8Array[] (previous master keys) across the boundary. Exact-pinned
# to the release paired with wasm-bindgen 0.2.121 above.
js-sys = "=0.3.98"
cachekit-core = { version = "0.6.0", features = ["encryption"] }
# Wipes the owned previous-master-key staging buffers on drop (the NAPI crate
# borrows and never copies; this crate must copy out of JS memory). Already in
# the tree transitively via cachekit-core — same resolved version.
zeroize = "1"

# Standalone crate — never join an enclosing cargo workspace.
[workspace]

# opt-level 3, not "z": the LZ4, xxh3, AES-GCM, GHASH and SHA-256 loops run on
# every SET pack, L2 read and secure op. z -> 3 plus simd128 (.cargo/config.toml)
# measured 2-4x faster LZ4 and ~1.5x faster AES for ~7 KB more gzip (LAB-7083).
# Output bytes are unchanged; the workers-lane fixtures pin that, including
# independent-reference vectors for the >1 KB xxh3 and multi-block AES paths.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
