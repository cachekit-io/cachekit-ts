[package]
name = "cachekit-core-ts"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# No napi4 or higher: under napi4, napi-rs registers a process-lifetime
# threadsafe function (its custom GC) as the module loads, and that function
# keeps the AsyncLocalStorage context of whatever first loads the addon. The
# binding runs every call on the JS thread and needs none of napi4's features.
napi = { version = "3", default-features = false, features = ["napi3", "dyn-symbols"] }
napi-derive = "3"
cachekit-core = { version = "0.7.0", features = ["encryption"] }
# Cache-key BLAKE2b-256 (blake2b256Hex). The 0.10 line builds on the digest 0.10
# that cachekit-core's sha2 and hmac already bring in, so it adds this one crate;
# 0.11 would add a second digest stack. It is also the line cachekit-core's own
# dev-dependency uses.
blake2 = { version = "0.10.6", default-features = false }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
