[package]
name = "cachekit-core-ts"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
cachekit-core = { version = "0.2.0", features = ["encryption"] }
zeroize = "1.8"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
